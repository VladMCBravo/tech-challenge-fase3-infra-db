name: CI/CD - Infraestrutura (Terraform)

on:
  push:
    branches:
      - main # Executa o Apply quando há um merge na main
  pull_request:
    branches:
      - main # Executa apenas o Plan quando é aberto um PR

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init

      # Importa os recursos que já existem na AWS para o state (idempotente).
      # Na 1ª execução ele traz RDS/SG/subnet-group para o state remoto.
      # Nas próximas, o "|| true" ignora "já gerenciado pelo Terraform".
      - name: Importar recursos existentes
        run: |
          terraform import aws_db_subnet_group.oficina_db_subnet oficina-db-subnet-v3 || true
          terraform import aws_security_group.rds_sg sg-0f94c8b808059d61a || true
          terraform import aws_db_instance.oficina_db oficina-db-prod || true

      - name: Terraform Format
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve tfplan